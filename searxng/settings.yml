# AimCram 本地 SearXNG 配置
# 运行时由 searxng/run.sh 复制到 .runtime/settings.yml，并替换 __SECRET__。
# 仅监听 127.0.0.1，不对外提供服务；只供本机 Learning Agent 检索使用。

use_default_settings: true

general:
  instance_name: 'AimCram Local SearXNG'
  enable_metrics: false
  debug: false

search:
  safe_search: 0
  default_lang: 'zh-CN'
  # Learning Agent 通过 format=json 读取结果，必须显式开启
  formats:
    - html
    - json

server:
  bind_address: '127.0.0.1'
  port: 8888
  base_url: 'http://127.0.0.1:8888/'
  secret_key: '__SECRET__'
  # 本机单用户使用，关闭限流与公共实例标记
  limiter: false
  public_instance: false
  image_proxy: false
  # Agent 使用 GET /search?format=json，必须允许 GET
  method: 'GET'

valkey:
  url: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
